for(var i=0;i<PN;i++)pulses.push({e:edges[Math.random()*edges.length|0],t:Math.random(),s:.5+Math.random()});

/* polvo estelar, nebulosas, fugaces */
(function(){var M=2200,p=new Float32Array(M*3);for(var i=0;i<M;i++){var r=22+Math.random()*50,u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(v)*Math.cos(u);p[i*3+1]=r*Math.cos(v);p[i*3+2]=r*Math.sin(v)*Math.sin(u)}
var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.35,map:dot,color:0x8a93a8,transparent:true,opacity:.45,depthWrite:false,blending:THREE.AdditiveBlending})))})();
var hGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:dot,color:0xff1f3a,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));hGlow.position.set(0,.3,0);hGlow.scale.set(8,8,1);scene.add(hGlow);
var hCore=new THREE.Sprite(new THREE.SpriteMaterial({map:dot,color:0xffc4cc,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false}));hCore.position.set(0,.3,0);hCore.scale.set(2.6,2.6,1);scene.add(hCore);
(function(){var M=mobile?450:900,p=new Float32Array(M*3);for(var i=0;i<M;i++){var r=3+Math.random()*9,u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(v)*Math.cos(u);p[i*3+1]=-.5+r*Math.cos(v)*.9;p[i*3+2]=r*Math.sin(v)*Math.sin(u)}
var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.09,map:dot,color:0xff3347,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending})))})();
/* cabeza de cristal azul (perfil) */
var HZF=[[3.1,0],[2.95,1.5],[2.5,2.9],[1.8,3.7],[1,4.05],[.4,4.2],[.05,4.1],[-.35,4.5],[-.8,5.3],[-1.1,4.8],[-1.4,4.6],[-1.65,4.85],[-1.95,4.55],[-2.25,4.7],[-2.6,4.3],[-3,4.5],[-3.3,3.9],[-3.5,3],[-4,2.65],[-5,2.6],[-5.8,3],[-6.5,4.5],[-7.2,6.5]];
var HZB=[[3.1,0],[2.95,-1.5],[2.5,-2.8],[1.8,-3.6],[1,-4.1],[0,-4.35],[-1,-4.4],[-1.7,-4.3],[-2.3,-3.7],[-3,-3],[-3.6,-2.6],[-4.5,-2.45],[-5.5,-2.6],[-6.2,-3.4],[-7.2,-6]];
var HW=[[3.1,0],[3,1.4],[2.6,2.4],[2,3.1],[1,3.5],[0,3.6],[-1,3.4],[-1.8,3],[-2.5,2.3],[-3,1.5],[-3.5,1.05],[-4.5,1.1],[-5.4,1.5],[-6.2,2.6],[-7.2,4.6]];
function spl(c,y){for(var i=0;i<c.length-1;i++){if(y<=c[i][0]&&y>=c[i+1][0]){var u=(c[i][0]-y)/(c[i][0]-c[i+1][0]),p0=c[Math.max(i-1,0)][1],p1=c[i][1],p2=c[i+1][1],p3=c[Math.min(i+2,c.length-1)][1];return .5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u)}}return c[c.length-1][1]}
(function(){var R=150,C=72,ps=[],ix=[];
for(var i=0;i<=R;i++){var y=3.1-i/R*10.3,zf=spl(HZF,y),zb=spl(HZB,y),a=Math.max(0,spl(HW,y)),zc=(zf+zb)/2,c=(zf-zb)/2;
 for(var j=0;j<=C;j++){var th=j/C*6.2832,co=Math.cos(th),si=Math.sin(th);ps.push(a*Math.sign(co)*Math.pow(Math.abs(co),.87),y,zc+c*Math.sign(si)*Math.pow(Math.abs(si),.87))}}
for(var i=0;i<R;i++)for(var j=0;j<C;j++){var a0=i*(C+1)+j,b0=a0+C+1;ix.push(a0,b0,a0+1,a0+1,b0,b0+1)}
var hg=new THREE.BufferGeometry();hg.setAttribute("position",new THREE.BufferAttribute(new Float32Array(ps),3));hg.setIndex(ix);hg.computeVertexNormals();
scene.add(new THREE.Mesh(hg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
vertexShader:"varying vec3 vN,vV;varying float vY;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=-mv.xyz;vY=position.y;gl_Position=projectionMatrix*mv;}",
fragmentShader:"varying vec3 vN,vV;varying float vY;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.2);float fade=smoothstep(-7.,-4.6,vY);vec3 c=vec3(.2,.55,1.)*(f*1.5+.05)+vec3(.5,.8,1.)*pow(f,6.)*.6;gl_FragColor=vec4(c*fade,1.);}"})))})();
var cg=new THREE.BufferGeometry();cg.setAttribute("position",new THREE.BufferAttribute(new Float32Array(6),3));
var comet=new THREE.Line(cg,new THREE.LineBasicMaterial({color:0xaed4ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(comet);
var cL=0,cD=1.1,cP=new THREE.Vector3(),cV=new THREE.Vector3(),cT=4;
function fire(){var f=new THREE.Vector3(),rg=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);camera.getWorldDirection(f);rg.crossVectors(f,up).normalize();
cP.copy(camera.position).addScaledVector(f,22).addScaledVector(rg,-8+Math.random()*10).addScaledVector(up,5+Math.random()*5);cV.copy(rg).multiplyScalar(18).addScaledVector(up,-7);cL=cD}

/* nodos de proyecto sobre el cerebro */
chips.forEach(function(c){var p=P[c.i],side=(c.i%3==2)?1:-1,tz=(p[2]-50)/100*7,ty=(43-p[3])/100*7,best=null,bd=1e9;
 for(var j=0;j<S.length;j++){var s=S[j];if(s[0]*side<1.3)continue;var d=(s[2]-tz)*(s[2]-tz)+(s[1]-ty)*(s[1]-ty);if(d<bd){bd=d;best=s}}
 if(!best)best=S[0];c.pos=new THREE.Vector3(best[0],best[1],best[2]).multiplyScalar(1.04);
 var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:dot,color:new THREE.Color(CAT[p[1]][1]),transparent:true,opacity:p[4]=="x"?.55:1,blending:THREE.AdditiveBlending,depthWrite:false}));
 sp.position.copy(c.pos);sp.scale.set(.3,.3,1);scene.add(sp);c.spr=sp});

/* cámara: arrastrar, pellizcar, rueda */
var ptrs={},pinch=0,dragging=false;
canvas.addEventListener("pointerdown",function(e){canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};dragging=true;$("hint").classList.add("off");$("drawer").classList.remove("on")});
canvas.addEventListener("pointermove",function(e){var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
 if(ids.length==2){var a=ptrs[ids[0]],b=ptrs[ids[1]];if(e.pointerId==ids[0])a={x:e.clientX,y:e.clientY};else b={x:e.clientX,y:e.clientY};var d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)cc.tr=Math.min(34,Math.max(3.5,cc.tr*(pinch/d)));pinch=d}
 else{cc.tTheta-=(e.clientX-p.x)*.006;cc.tPhi=Math.min(2.3,Math.max(.7,cc.tPhi-(e.clientY-p.y)*.004))}
 p.x=e.clientX;p.y=e.clientY});
function endP(e){delete ptrs[e.pointerId];pinch=0;if(!Object.keys(ptrs).length)dragging=false}
canvas.addEventListener("pointerup",endP);canvas.addEventListener("pointercancel",endP);
canvas.addEventListener("wheel",function(e){e.preventDefault();cc.tr=Math.min(34,Math.max(3.5,cc.tr+e.deltaY*.01))},{passive:false});

/* bucle */
var last=performance.now(),time=0,tmp=new THREE.Vector3(),cd=new THREE.Vector3();
function tick(now){var dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 var kk=Math.min(1,dt*3);U.uThink.value+=((mode=="think"?1:0)-U.uThink.value)*kk;U.uSleep.value+=((mode=="sleep"?1:0)-U.uSleep.value)*kk;
 U.uTime.value=time;U.uWave.value=(time*2)%5.4;
 var spd=.5+U.uThink.value*1.8-U.uSleep.value*.35;
 for(var i=0;i<PN;i++){var q=pulses[i];q.t+=dt*q.s*spd*(reduce?.3:1);if(q.t>=1){q.t=0;q.e=edges[Math.random()*edges.length|0]}
  var A=q.e[0],B=q.e[1];pp[i*3]=pos[A*3]+(pos[B*3]-pos[A*3])*q.t;pp[i*3+1]=pos[A*3+1]+(pos[B*3+1]-pos[A*3+1])*q.t;pp[i*3+2]=pos[A*3+2]+(pos[B*3+2]-pos[A*3+2])*q.t}
 pg.attributes.position.needsUpdate=true;
 if(!dragging&&!reduce)cc.tTheta+=dt*.1*Math.cos(time*.3)*(1-U.uSleep.value*.7);hGlow.material.opacity=(.28+.1*Math.sin(time*2.2))*(1-.5*U.uSleep.value);hCore.material.opacity=(.3+.2*U.uThink.value+.08*Math.sin(time*3))*(1-.6*U.uSleep.value);
 if(!started){started=true;cc.tr=baseR}
 cc.theta+=(cc.tTheta-cc.theta)*Math.min(1,dt*5);cc.phi+=(cc.tPhi-cc.phi)*Math.min(1,dt*5);cc.r+=(cc.tr-cc.r)*Math.min(1,dt*2.2);
 camera.position.set(cc.r*Math.sin(cc.phi)*Math.sin(cc.theta),cc.r*Math.cos(cc.phi),cc.r*Math.sin(cc.phi)*Math.cos(cc.theta)).add(look);camera.lookAt(look);
 cd.copy(camera.position).sub(look).normalize();
 var W=innerWidth,H=innerHeight;
 chips.forEach(function(c,i){var v=tmp.copy(c.pos).project(camera),face=c.pos.clone().sub(look).normalize().dot(cd)>.1&&v.z<1;
  c.el.classList.toggle("back",!face);c.el.style.transform="translate("+((v.x*.5+.5)*W)+"px,"+((-.5*v.y+.5)*H)+"px) translate(-50%,-50%)";
  var s=.3+.07*Math.sin(time*3+i)+(c.el.classList.contains("hot")?.16:0);c.spr.scale.set(s,s,1)});
 if(!reduce){cT-=dt;if(cT<=0){fire();cT=7+Math.random()*8}}
 if(cL>0){cL-=dt;cP.addScaledVector(cV,dt);var a=comet.geometry.attributes.position.array;a[0]=cP.x;a[1]=cP.y;a[2]=cP.z;a[3]=cP.x-cV.x*.16;a[4]=cP.y-cV.y*.16;a[5]=cP.z-cV.z*.16;comet.geometry.attributes.position.needsUpdate=true;comet.material.opacity=Math.sin(Math.PI*Math.max(0,1-cL/cD))*.9}else comet.material.opacity=0;
 renderer.render(scene,camera);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
canvas.classList.add("in");setTimeout(function(){$("title").classList.add("show")},50);
}
try{init3D();setMode("think")}catch(e){document.body.classList.add("no3d");$("title").classList.add("show");$("hint").textContent="Tu dispositivo no puede mostrar el cerebro en 3D.";setMode("think")}
})();
